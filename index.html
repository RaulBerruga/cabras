<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Cabras</title>
<meta name="application-name" content="Cabras">
<meta name="apple-mobile-web-app-title" content="Cabras">
<meta name="theme-color" content="#1F5C48">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EEE7; --bg2:#D6E3D6; --panel:#FFFFFF; --glass:rgba(255,255,255,.74); --ink:#13211B; --mute:#5C6C63; --line:#CFD8CE; --soft:#E2E9E0; --shadow:0 10px 30px rgba(20,40,32,.10);
  --felt:#1F5C48; --felt-deep:#153F32; --felt-edge:#2E7A5E;
  --chip:#F3E9CF; --chip-soft:rgba(243,233,207,.78); --chip-line:rgba(243,233,207,.32);
  --gold:#E2B55A; --gold2:#F0C66A; --gold-ink:#2A1E07; --red:#D1413A;
  --r:22px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#0C2A21; --bg2:#17483A; --panel:#17352D; --glass:rgba(23,53,45,.72); --ink:#EEF2EC; --mute:#9DB3A7; --line:#2A4D41; --soft:#1F4237; --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#0C2A21; --bg2:#17483A; --panel:#17352D; --glass:rgba(23,53,45,.72); --ink:#EEF2EC; --mute:#9DB3A7; --line:#2A4D41; --soft:#1F4237; --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark; }
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;-webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;font-optical-sizing:auto;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(120% 70% at 50% -10%,var(--bg2) 0%,var(--bg) 60%)}
main{max-width:560px;margin:0 auto;padding:12px 16px 40px}
[hidden]{display:none!important}

::view-transition-group(*){animation-duration:.3s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
::view-transition-old(root),::view-transition-new(root){animation-duration:.16s}
.stage{view-transition-name:stage}
.wheel-wrap{view-transition-name:wheel}
.ring{view-transition-name:turn}
.big-name{view-transition-name:bigname}

/* motion helpers */
.in{animation:rise .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*60ms)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}

/* type */
h2{font-size:19px;font-weight:800;letter-spacing:-.02em;margin:0}
.lead{color:var(--mute);font-size:16px;margin:0 0 16px;max-width:40ch}
.hint{color:var(--mute);font-size:14px;margin:8px 0 0}
.hint.center{text-align:center}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:18px 0 8px}

/* controls */
input[type=text],input[type=number],input[type=email],input[type=password]{-webkit-appearance:none;appearance:none;font:inherit;font-size:16px;padding:12px 13px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:inherit;min-width:0;flex:1;width:100%;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(226,181,90,.25);outline:none}
button:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button{-webkit-appearance:none;appearance:none;-webkit-user-select:none;user-select:none;font:inherit;cursor:pointer;border:0;border-radius:14px;padding:11px 15px;background:var(--soft);color:var(--ink);font-weight:600;touch-action:manipulation;transition:transform .12s cubic-bezier(.2,1.4,.4,1),opacity .2s,background .15s,box-shadow .15s}
button:active{transform:scale(.96)}
button.primary{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--gold-ink);box-shadow:0 6px 18px rgba(226,181,90,.35),inset 0 1px 0 rgba(255,255,255,.35)}
button.ghost{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
button.pill{border-radius:999px}
button:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.big{width:100%;padding:16px;font-size:17px;border-radius:16px}
.big+.big{margin-top:8px}
.link{display:block;margin:6px auto 0;padding:8px 0;background:transparent;color:var(--mute);text-decoration:underline;font-weight:500}
.card{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 12px;box-shadow:var(--shadow)}
.icon-btn{width:42px;height:42px;padding:0;border-radius:50%;background:var(--glass);border:1px solid var(--line);color:var(--ink);display:inline-grid;place-items:center}
.icon-btn svg,.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px}
.seg button{background:transparent;padding:7px 14px;border-radius:999px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg.wide{display:flex}.seg.wide button{flex:1}
.tabs{display:flex;gap:4px;background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:4px;margin:0 0 12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.tabs button{flex:1;padding:9px 4px;border-radius:12px;background:transparent;color:var(--mute);font-size:14px}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.confirm{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--panel);text-align:center;font-size:14px;color:var(--mute);margin:6px 0}
.confirm div{display:flex;gap:8px}
.confirm button,.foot .confirm button{background:var(--soft);color:var(--ink)}
.confirm button.danger,.foot .confirm button.danger{background:var(--red);color:#fff}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:50;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translateX(-50%)}
#upd{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:60;background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--gold-ink);border-radius:16px;padding:13px 14px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25);text-align:center;animation:rise .4s both}

/* avatars */
.av{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;font-weight:800;font-size:13px;flex:none;color:#F3E9CF;letter-spacing:0;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.av.sm{width:26px;height:26px;font-size:11px}
.av.lg{width:56px;height:56px;font-size:20px}
.avs{display:inline-flex;align-items:center}
.avs .av{margin-left:-8px;box-shadow:0 0 0 2px var(--panel)}
.avs .av:first-child{margin-left:0}

/* bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 12px;min-height:42px}
.bar-mid{text-align:center;min-width:0;flex:1;display:flex;flex-direction:column;align-items:center}
.bar-title{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.bar-sub{font-size:13px;color:var(--mute)}
.sync{display:inline-flex;align-items:center;gap:6px;background:transparent;padding:2px 6px;font-size:12px;font-weight:600;color:var(--mute);border-radius:999px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--mute);flex:none}
.sync.saved i{background:var(--felt-edge)}
.sync.saving i{background:var(--gold);animation:blink 1s infinite}
.sync.offline i{background:var(--gold)}
.sync.error{color:var(--red)}
.sync.error i{background:var(--red)}
@keyframes blink{50%{opacity:.3}}
.syncrow{display:flex;justify-content:center;margin:-4px 0 10px}
.pring{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mute)}
.pring svg{width:26px;height:26px;transform:rotate(-90deg)}
.pring circle{fill:none;stroke-width:3.5}
.pring .bgc{stroke:var(--line)}
.pring .fgc{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}

/* hero */
.hero{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,var(--felt-edge) 0%,var(--felt) 45%,var(--felt-deep) 100%);color:var(--chip);border-radius:30px;padding:24px 22px 22px;margin:4px 0 14px;box-shadow:inset 0 0 0 6px rgba(0,0,0,.2),inset 0 0 0 7px rgba(255,255,255,.09),0 16px 40px rgba(20,60,45,.28)}
.hero::after{content:"";position:absolute;inset:-40% -20% auto;height:60%;background:radial-gradient(60% 60% at 50% 50%,rgba(255,255,255,.14),transparent 70%);pointer-events:none}
.hero h1{font-size:clamp(58px,20vw,100px);font-weight:800;letter-spacing:-.05em;line-height:.85;margin:0}
.hero p{margin:12px 0 0;font-size:16px;color:var(--chip-soft);max-width:28ch}
.hero .who{font-size:13px;color:var(--chip-soft);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.hero .mark{position:absolute;right:14px;top:14px;width:64px;height:64px;opacity:.95;filter:drop-shadow(0 6px 12px rgba(0,0,0,.3))}
.hero.compact{padding:18px 20px}
.hero.compact h1{font-size:clamp(40px,12vw,56px)}
.cont{display:flex;align-items:center;gap:12px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--gold);box-shadow:0 0 0 2px var(--gold),var(--shadow);border-radius:20px;padding:12px 14px;margin:0 0 12px;width:100%;text-align:left;color:var(--ink)}
.cont .ci{flex:1;min-width:0}
.cont .ct{font-weight:800}
.cont .cs{font-size:13px;color:var(--mute)}
.cont .go svg{width:20px;height:20px;stroke:var(--mute);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 0}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border-radius:20px;background:var(--glass);border:1px solid var(--line);text-align:left;color:var(--ink);min-height:92px;box-shadow:var(--shadow)}
.tile .ib{width:36px;height:36px;border-radius:12px;background:var(--soft);display:grid;place-items:center;color:var(--felt-edge)}
.tile b{font-size:15px}
.tile small{color:var(--mute);font-size:12px;font-weight:500}
.recent{list-style:none;padding:0;margin:0}
.recent li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.recent li:first-child{border-top:0;padding-top:0}
.recent .ri{flex:1;min-width:0}
.recent .rt{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent .rs{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent button{padding:8px 12px;font-size:14px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--mute);margin-left:6px;vertical-align:middle}
.tag.live{background:var(--gold);color:var(--gold-ink)}
.rules ol{padding-left:22px;margin:0}
.rules li{margin:0 0 12px;padding-left:4px}
.rules li::marker{font-weight:800;color:var(--felt-edge)}
.version{color:var(--mute);font-size:12px;text-align:center;margin:18px 0 0}

/* auth */
.auth label{display:block;font-weight:600;font-size:14px;margin:0 0 10px}
.auth label input{margin-top:5px}
.pw{position:relative}
.pw input{padding-right:62px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:5px 9px;background:transparent;color:var(--mute);font-size:13px;margin-top:2px}
.auth .err{color:var(--red);font-size:14px;min-height:20px;margin:2px 0 6px}
.auth .seg{margin:0 0 14px}

/* setup */
.block{margin:0 0 12px}
.blockhead{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.blockhead .num{width:26px;height:26px;border-radius:50%;background:var(--felt);color:var(--chip);display:grid;place-items:center;font-size:13px;font-weight:800;flex:none}
.count{font-size:13px;color:var(--mute);font-weight:600;margin-left:auto}
.adder{display:flex;gap:8px}
.adder input{flex:1}
.chips{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border-radius:999px;padding:6px 6px 6px 13px;font-weight:500;animation:popin .25s cubic-bezier(.2,1.4,.4,1) both}
@keyframes popin{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.chip button{padding:2px 8px;border-radius:999px;background:transparent;color:var(--mute);font-size:17px;line-height:1}
.chip button:hover{color:var(--red)}
.plist{list-style:none;margin:12px 0 0;padding:0}
.plist li{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.plist li:first-child{border-top:0;padding-top:0}
.plist .nm{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon{padding:6px 9px;background:transparent;color:var(--mute);font-size:16px}
.rules-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.rules-row:first-child{border-top:0;padding-top:0}
.rules-row label,.rules-row .lbl{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
.rules-row input{width:84px;flex:none;padding:8px 10px}
.cta{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;margin-top:12px;padding:8px;border-radius:20px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:var(--shadow)}
.cta .big{margin:0}

/* stage */
.stage{position:relative;background:radial-gradient(120% 90% at 50% 0%,var(--felt-edge) 0%,var(--felt) 45%,var(--felt-deep) 100%);color:var(--chip);border-radius:28px;padding:14px 16px 18px;margin:0 0 12px;box-shadow:inset 0 0 0 6px rgba(0,0,0,.2),inset 0 0 0 7px rgba(255,255,255,.09),0 14px 36px rgba(20,60,45,.3);overflow:hidden}
.stage-top{display:flex;justify-content:center;align-items:center;min-height:40px}
.stage-top.left{justify-content:flex-start;gap:12px}
.stage .seg{background:rgba(0,0,0,.28)}
.stage .seg button{color:var(--chip-soft)}
.stage .seg button.on{background:var(--chip);color:var(--felt-deep)}
.arena{display:grid;place-items:center;min-height:250px;padding:6px 0 4px}
.tap{background:transparent;padding:0;border-radius:32px}
.sub{text-align:center;color:var(--chip-soft);font-size:16px;margin:6px 0 0}
.stage-top .sub{margin:0;text-align:left}
.stage-actions{margin-top:14px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.stage-actions .primary{padding:14px 28px;font-size:17px}
.big-name{font-size:clamp(36px,10.5vw,52px);font-weight:800;letter-spacing:-.03em;line-height:1.02;text-align:center;word-break:break-word;overflow-wrap:anywhere;margin:8px 0 2px}
.big-name.reveal{animation:reveal .55s cubic-bezier(.2,1.2,.3,1) both}
@keyframes reveal{from{transform:scale(.6);opacity:0;filter:blur(6px)}to{transform:none;opacity:1;filter:none}}

/* wheel */
.wheel-wrap{position:relative;width:min(300px,78vw);height:min(300px,78vw);margin:10px 0 4px}
.tap .wheel-wrap{animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
.wheel{width:100%;height:100%;display:block;border-radius:50%;transform-origin:50% 50%;box-shadow:0 16px 32px rgba(0,0,0,.38),0 0 0 6px var(--chip),0 0 0 8px rgba(0,0,0,.28)}
.wheel text{font-family:inherit}
.pointer{position:absolute;left:50%;top:-12px;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:30px solid var(--red);z-index:2;filter:drop-shadow(0 3px 3px rgba(0,0,0,.45))}
.wheel-wrap.mini{width:48px;height:48px;margin:0}
.wheel-wrap.mini .wheel{box-shadow:0 0 0 2px var(--chip),0 3px 8px rgba(0,0,0,.3)}
.wheel-wrap.mini .pointer{top:-6px;border-left-width:6px;border-right-width:6px;border-top-width:12px}

/* bidding */
.bidbox{margin-top:12px;padding-top:12px;border-top:1px solid var(--chip-line)}
.highbid{display:flex;align-items:baseline;justify-content:center;gap:10px;flex-wrap:wrap}
.hb-amt{font-size:50px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;display:inline-block}
.hb-amt.faint{opacity:.4}
.hb-amt.pop{animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(1.5);color:var(--gold)}to{transform:none}}
.hb-who{font-size:15px;color:var(--chip-soft)}
.turnline{display:flex;align-items:center;justify-content:center;gap:10px;margin:12px 0 0;font-size:18px}
.turnline b{font-weight:800}
.turnline .tl{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}
.turnline small{font-size:13px;color:var(--chip-soft)}
.chips3{display:flex;justify-content:center;gap:14px;margin:14px 0 8px}
.chipbtn{--c:var(--chip);--ci:var(--felt-deep);width:80px;height:80px;border-radius:50%;background:var(--c);color:var(--ci);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;box-shadow:0 6px 0 rgba(0,0,0,.32),inset 0 0 0 5px rgba(0,0,0,.08),inset 0 0 0 8px var(--c),inset 0 0 0 10px rgba(0,0,0,.1),inset 0 14px 18px -10px rgba(255,255,255,.45);transition:transform .08s,box-shadow .08s,opacity .2s}
.chipbtn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.32),inset 0 0 0 5px rgba(0,0,0,.08),inset 0 0 0 8px var(--c),inset 0 0 0 10px rgba(0,0,0,.1)}
.chipbtn.c5{--c:var(--red);--ci:var(--chip)}
.chipbtn.c10{--c:var(--gold);--ci:var(--gold-ink)}
.chipbtn:disabled{opacity:.3}
.chipbtn .amt{font-size:25px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.chipbtn .inc{font-size:11px;font-weight:700;opacity:.75;margin-top:3px}
.link-felt{display:block;margin:0 auto 6px;background:transparent;color:var(--chip-soft);text-decoration:underline;font-weight:500;padding:6px 10px}
.keypad{margin:4px 0 8px;background:rgba(0,0,0,.22);border-radius:18px;padding:10px;animation:rise .25s both}
.kp-display{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:2px 8px 8px;color:var(--chip)}
.kp-display span{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;min-width:2ch}
.kp-display span.empty{opacity:.4}
.kp-display small{font-size:13px;color:var(--chip-soft);text-align:right}
.kp-display small.bad{color:#F4A39E}
.kp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kp-grid button{padding:13px 0;font-size:20px;font-weight:700;background:rgba(243,233,207,.14);color:var(--chip);border-radius:12px;font-variant-numeric:tabular-nums}
.kp-grid button.go{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--gold-ink);font-size:16px}
.kp-grid button.del{font-size:16px}

<body>
<main id="app"></main>
<noscript><p style="padding:20px">Esta app necesita JavaScript.</p></noscript>
<script>
(function(){
const APP_VERSION='4.2';
const KEY='cabras-v2', OLDKEYS=['cabras-v1','subasta-v1'];
const SAMPLE={names:['Marta','Pablo','Lucía','Hugo','Carla','Dani','Sofía','Mateo'],players:['Álvaro','Nerea','Jorge']};
const reduced=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const app=document.getElementById('app');
let busy=false, revealNext=false, lastHigh=null, hbFrom=null, confirming=null, view='home', keypad=false, keyBuf='', authMode='login', showPw=false, tab='mesa', savedFilter='all', celebrate=false;

function fresh(){return{phase:'setup',mode:'wheel',pool:[],players:[],allNames:[],budget:100,round:0,wheelAngle:0,current:null,nextStart:0,ratings:{},rateIdx:0,log:[],hist:[],cloudId:null,ownerId:null,sound:true,teamsOpen:false,logOpen:false,setOpen:false,seq:1};}
function load(){try{let r=localStorage.getItem(KEY);for(const k of OLDKEYS){if(!r)r=localStorage.getItem(k);}if(!r)return null;const o=JSON.parse(r);return(o&&o.phase)?o:null;}catch(e){return null;}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} scheduleSync();}
let S=load()||fresh();
(function sanity(){
  const d=fresh(); for(const k in d){ if(S[k]===undefined) S[k]=d[k]; }
  S.seq=Math.max(S.seq||0,1000); S.mode='wheel';
  if(S.phase==='bid'&&!S.current)S.phase='pick';
  if(['pick','bid','sold','rate'].includes(S.phase)&&S.players.length<2)S.phase='setup';
  if(S.phase==='rate'&&S.rateIdx>=S.players.length)S.rateIdx=0;
  if(S.phase==='pick'&&S.players.length>=2&&!anyAlive())S.phase='rate';
})();

/* ---------- helpers ---------- */
function uid(){return S.seq++;}
function set(fn,after){confirming=null;fn(S);save();render(after);}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function trunc(s,n){return s.length>n?s.slice(0,n-1)+'…':s;}
function left(p){return S.budget>0?S.budget-p.spent:Infinity;}
function byId(id){return S.players.find(p=>p.id===id);}
function idx(p){return S.players.indexOf(p);}
function alive(p){return S.budget===0||left(p)>0;}
function anyAlive(){return S.players.some(alive);}
function nextAlive(from){const n=S.players.length;for(let k=1;k<=n;k++){const i=(from+k)%n;if(alive(S.players[i]))return i;}return -1;}
function firstAliveFrom(i0){const n=S.players.length;for(let k=0;k<n;k++){const i=(i0+k)%n;if(alive(S.players[i]))return i;}return -1;}
function contenders(s){return s.players.filter(p=>alive(p)&&!s.current.passed.includes(p.id));}
function nextInAuction(s,from){const n=s.players.length;for(let k=1;k<=n;k++){const i=(from+k)%n;const p=s.players[i];if(alive(p)&&!s.current.passed.includes(p.id))return i;}return -1;}
function plural(n,s,p){return n+' '+(n===1?s:p);}
function teamHTML(p){return p.won.length?p.won.map(w=>`${esc(w.name)} (${w.price})`).join(', '):'Sin nadie todavía';}
function fmtAvg(v){return v.toFixed(1).replace('.',',');}
function inProgress(){return ['pick','bid','sold','rate'].includes(S.phase);}
function inGame(){return ['pick','bid','sold'].includes(S.phase)&&!view;}
const PAL=[['#2E7A5E','#F3E9CF'],['#D1413A','#F3E9CF'],['#E2B55A','#2A1E07'],['#3B6EA8','#F3E9CF'],['#8E4EA3','#F3E9CF'],['#D97A2B','#2A1E07'],['#2A9D8F','#F3E9CF'],['#B5485D','#F3E9CF']];
function initials(n){return String(n).trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'?';}
function avHTML(name,i,cls){const [bg,fg]=PAL[((i%PAL.length)+PAL.length)%PAL.length];return `<span class="av ${cls||''}" style="background:${bg};color:${fg}" aria-hidden="true">${esc(initials(name))}</span>`;}
function avsHTML(names,cls){return `<span class="avs">${names.slice(0,5).map((n,i)=>avHTML(n,i,cls||'sm')).join('')}</span>`;}

/* ---------- nube (Supabase) ----------
   Pega aquí la URL del proyecto y la clave "publishable" (Settings, API Keys).
   Con ellas, jugar requiere cuenta y todo se guarda en la nube. Sin ellas, la app funciona solo en local. */
const CLOUD={url:'https://fovuhtslwumzybptojcj.supabase.co',key:'sb_publishable_ZsC5-4gZJ5DHsMNPQvHCuw_Y14j9lie'};
const cloudConfigured=/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(CLOUD.url)&&!/PEGA_AQUI/.test(CLOUD.key);
let sb=null,user=null,authReady=!cloudConfigured,cloudErr='',syncTimer=null,dirty=false,saved=null,savedBusy=false,savedFor=null,savedAt=0,authBusy=false,syncState='idle',syncMsg='',syncAt=0,accessToken=null;
function gate(){return cloudConfigured&&!user;}
function newId(){try{return crypto.randomUUID();}catch(e){return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16);});}}
function cloudInit(){
  try{sb=window.supabase.createClient(CLOUD.url.replace(/\/$/,''),CLOUD.key);}catch(e){sb=null;cloudErr='No se pudo iniciar Supabase';authReady=true;render();return;}
  const apply=u=>{
    const changed=(u&&u.id)!==(user&&user.id); user=u||null; authReady=true;
    if(user&&S.ownerId&&S.ownerId!==user.id){ // partida local de otra cuenta: no se mezcla
      const prefs={};for(const k of UIKEYS)prefs[k]=S[k]; S=Object.assign(fresh(),prefs,{hist:[]}); try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
    }
    if(changed){saved=null;savedFor=null;if(user){dirty=true;flush();}}
    render();
  };
  try{sb.auth.getSession().then(r=>{const s=r&&r.data&&r.data.session;accessToken=s?s.access_token:null;apply(s?s.user:null);}).catch(()=>apply(null));}catch(e){apply(null);}
  try{sb.auth.onAuthStateChange((ev,sess)=>{accessToken=sess?sess.access_token:null;const u=sess?sess.user:null;if((u&&u.id)!==(user&&user.id))apply(u);});}catch(e){}
}
function cloudBoot(){
  if(!cloudConfigured) return;
  if(window.supabase){cloudInit();return;}
  cloudErr='';
  const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js';s.async=true;
  s.onload=cloudInit;s.onerror=()=>{cloudErr='Sin conexión. Hace falta internet para entrar.';authReady=true;render();};
  document.head.appendChild(s);
}
function cloudSaveable(){return !!(S.cloudId&&(inProgress()||S.phase==='end'));}
function scheduleSync(){if(!sb||!user||!cloudSaveable())return;dirty=true;clearTimeout(syncTimer);syncTimer=setTimeout(flush,1200);}
function resumenData(){return results().map((r,i)=>({puesto:i+1,nombre:r.p.name,media:Math.round(r.avg*10)/10,equipo:r.p.won,gastadas:r.p.spent}));}
function rowNow(){return {id:S.cloudId,fase:S.phase,estado:JSON.parse(snap()),resumen:S.phase==='end'?resumenData():null,actualizada:new Date().toISOString()};}
function setSync(st,msg){const changed=st!==syncState||msg!==syncMsg;syncState=st;syncMsg=msg||'';if(changed){const el=document.getElementById('sync');if(el){el.outerHTML=syncHTML();}}}
async function flush(){
  if(!sb||!user||!dirty||!cloudSaveable())return;
  dirty=false; clearTimeout(syncTimer);
  const row=rowNow(); setSync('saving','');
  try{
    const r=await sb.from('partidas').upsert(row); if(r&&r.error)throw r.error;
    cloudErr=''; syncAt=Date.now(); setSync('saved','');
    if(saved){const i=saved.findIndex(x=>x.id===row.id);const merged=Object.assign({user_id:user.id},saved[i]||{},row);if(i>=0)saved[i]=merged;else saved.unshift(merged);}
  }catch(e){
    dirty=true; cloudErr=authMsg(e);
    const off=!navigator.onLine||/conexión/i.test(cloudErr);
    setSync(off?'offline':'error',cloudErr);
    if(!off&&!flush.warned){flush.warned=true;toast('No se ha podido guardar en la nube');}
  }
}
// last chance when the app goes to the background or closes: a keepalive request with the session token
function flushOnExit(){
  if(!dirty||!user||!accessToken||!cloudSaveable())return;
  try{
    fetch(CLOUD.url.replace(/\/$/,'')+'/rest/v1/partidas?on_conflict=id',{method:'POST',keepalive:true,headers:{'apikey':CLOUD.key,'Authorization':'Bearer '+accessToken,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rowNow())}).then(r=>{if(r.ok){dirty=false;syncAt=Date.now();}}).catch(()=>{});
  }catch(e){}
}
window.addEventListener('pagehide',flushOnExit);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushOnExit();});
function syncHTML(){
  if(!cloudConfigured||!user||!cloudSaveable()) return '<span id="sync"></span>';
  const m={saving:['saving','Guardando…'],saved:['saved','Guardado en la nube'],offline:['offline','Sin conexión: se guardará al volver'],error:['error','No guardado: '+syncMsg+'. Toca para reintentar']}[syncState]||['idle',dirty?'Cambios sin guardar':'Guardado en la nube'];

}
async function loadSaved(){
  if(!sb||!user||savedBusy)return; savedBusy=true; render();
  try{const r=await sb.from('partidas').select('id,user_id,fase,actualizada,estado,resumen').order('actualizada',{ascending:false}).limit(100);if(r.error)throw r.error;saved=r.data||[];savedFor=user.id;savedAt=Date.now();cloudErr='';}
  catch(e){saved=[];cloudErr=authMsg(e);}
  savedBusy=false; render();
}
async function deleteSaved(id){
  try{const r=await sb.from('partidas').delete().eq('id',id);if(r.error)throw r.error;saved=(saved||[]).filter(x=>x.id!==id);toast('Partida borrada');}
  catch(e){toast('No se ha podido borrar');}
  render();
}
function prefsOf(){const p={};for(const k of UIKEYS)p[k]=S[k];return p;}
function openSaved(id){
  const row=(saved||[]).find(x=>x.id===id); if(!row||!row.estado)return;
  if(cloudSaveable()&&dirty)flush();
  S=Object.assign(fresh(),row.estado,prefsOf(),{hist:[]}); S.cloudId=(user&&row.user_id===user.id)?row.id:null; S.ownerId=user?user.id:null;

}
function repeatSaved(id){
  const row=(saved||[]).find(x=>x.id===id); if(!row||!row.estado)return;
  const e=row.estado, names=(e.allNames&&e.allNames.length)?e.allNames:(e.pool||[]).map(p=>p.name), players=(e.players||[]).map(p=>p.name);
  if(!names.length||players.length<2){toast('Esa partida no tiene listas completas');return;}
  if(cloudSaveable()&&dirty)flush();
  S=Object.assign(fresh(),prefsOf(),{hist:[]}); S.seq=1000; S.budget=typeof e.budget==='number'?e.budget:100; S.mode='wheel';
  S.pool=names.map(n=>({id:uid(),name:n})); S.players=players.map(n=>({id:uid(),name:n,spent:0,won:[]})); S.phase='setup';
  view=null; confirming=null; save(); render(); window.scrollTo(0,0); toast('Listas cargadas, pulsa Empezar');
}
function authMsg(e){
  const m=(e&&e.message)||String(e||'');
  if(/Invalid login credentials/i.test(m))return 'Correo o contraseña incorrectos.';
  if(/already registered/i.test(m))return 'Ese correo ya tiene cuenta: pulsa Entrar.';
  if(/Password should be|at least 6/i.test(m))return 'La contraseña necesita al menos 6 caracteres.';
  if(/rate limit|too many/i.test(m))return 'Demasiados intentos seguidos. Espera un momento.';
  if(/Email not confirmed/i.test(m))return 'Confirma el correo desde el mensaje que te ha llegado.';
  if(/invalid.*email|Unable to validate email/i.test(m))return 'Ese correo no parece válido.';
  if(/Failed to fetch|NetworkError|network|Load failed/i.test(m))return 'Sin conexión con la nube.';
  if(/relation .* does not exist|schema cache/i.test(m))return 'Falta la tabla "partidas" en Supabase (ejecuta supabase.sql).';
  if(/row-level security|violates/i.test(m))return 'Supabase ha rechazado el guardado (revisa las políticas RLS).';
  return m||'Error desconocido';
}
async function doAuth(kind,email,pass){
  if(!sb||authBusy)return; authBusy=true; cloudErr=''; render();
  try{

function tone(f,d,type,g){
  if(!S.sound) return;

    const o=AC.createOscillator(), v=AC.createGain(), t=AC.currentTime;

    v.gain.exponentialRampToValueAtTime(g||.08,t+.012); v.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(v); v.connect(AC.destination); o.start(t); o.stop(t+d+.03);
  }catch(e){}
}

function confetti(){

    const cols=['#E2B55A','#F3E9CF','#D1413A','#2E7A5E'];
    const ps=Array.from({length:90},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.38,vx:(Math.random()-.5)*14*dpr,vy:(-Math.random()*16-6)*dpr,r:(3+Math.random()*4)*dpr,c:cols[Math.random()*4|0],a:Math.random()*6.28,s:(Math.random()-.5)*.3}));
    const t0=performance.now();

}

/* ---------- game logic ---------- */
function restoreLists(s){
  s.pool=s.allNames.length?s.allNames.map(n=>({id:uid(),name:n})):s.pool;
  s.players.forEach(p=>{p.spent=0;p.won=[];});
  s.ratings={};s.rateIdx=0;s.log=[];s.hist=[];s.round=0;s.nextStart=0;s.current=null;
}
function doEdit(){view=null;set(s=>{restoreLists(s);s.phase='setup';});window.scrollTo(0,0);}
function startGame(){
  if(S.pool.length<1||S.players.length<2) return;
  tab='mesa';
  set(s=>{s.allNames=s.pool.map(p=>p.name);s.players.forEach(p=>{p.spent=0;p.won=[];});s.round=0;s.nextStart=0;s.current=null;s.log=[];s.hist=[];s.ratings={};s.rateIdx=0;s.cloudId=newId();s.ownerId=user?user.id:null;s.phase='pick';});
  window.scrollTo(0,0);
}
function startBidding(i,extra){
  lastHigh=null; keypad=false; keyBuf='';
  set(s=>{
    pushHist();
    const item=s.pool[i], t=firstAliveFrom(s.nextStart);
    s.current={poolId:item.id,name:item.name,high:0,highBidder:null,turn:t<0?0:t,opener:t<0?0:t,passed:[],winner:null,price:0};
    s.phase='bid';
  });
}
// The bidding goes round the table in turn order. Passing puts you out of this name only;
// it continues among the rest until one is left, who pays the goats bid (they disappear).
// The next name is opened by the player after the one who opened this one.
// Nobody leaves the game unless they reach 0 goats.
function closeAuction(s){
  const cur=s.current, w=byId(cur.highBidder);
  w.spent+=cur.high; w.won.push({name:cur.name,price:cur.high});
  s.pool=s.pool.filter(p=>p.id!==cur.poolId);
  cur.winner=w.id; cur.price=cur.high;
  s.log.push({round:s.round+1,name:cur.name,winner:w.name,price:cur.high});
  s.nextStart=(cur.opener+1)%s.players.length; s.round++; s.phase='sold';
  snd.sold(); buzz(40); celebrate=true;
}
function placeBid(amt){
  const cur=S.current; if(!cur||S.phase!=='bid') return;
  const p=S.players[cur.turn];
  if(!Number.isInteger(amt)||amt<=cur.high||amt>left(p)) return;
  keypad=false; keyBuf='';
  set(s=>{
    pushHist();
    cur.high=amt; cur.highBidder=p.id;
    if(contenders(s).length<=1) closeAuction(s);
    else {cur.turn=nextInAuction(s,cur.turn); snd.bid();}
  });
}
function passTurn(){
  const cur=S.current; if(!cur||S.phase!=='bid') return;
  keypad=false; keyBuf='';
  set(s=>{
    pushHist();
    const i=cur.turn;
    cur.passed.push(s.players[i].id); snd.pass();
    const rest=contenders(s);
    if(cur.highBidder&&rest.length===1&&rest[0].id===cur.highBidder){closeAuction(s);return;}
    if(!rest.length){cur.winner=null;s.log.push({round:s.round+1,name:cur.name,winner:null,price:0});s.nextStart=(cur.opener+1)%s.players.length;s.round++;s.phase='sold';return;}
    cur.turn=nextInAuction(s,i);
  });
}
function nextName(){
  if(S.phase!=='sold') return;
  set(s=>{pushHist();s.current=null;if(s.pool.length&&anyAlive()){s.phase='pick';}else{s.phase='rate';s.ratings={};s.rateIdx=0;}});
  window.scrollTo(0,0);
}
function spinWheel(){
  const n=S.pool.length; if(!n||busy) return;
  const pick=Math.floor(Math.random()*n);
  const svg=document.getElementById('wheel'); if(!svg) return;
  if(reduced){startBidding(pick,{});return;}
  const seg=360/n;
  const jitter=(Math.random()-0.5)*seg*0.7;
  const desired=(((360-(pick*seg+seg/2)+jitter)%360)+360)%360;
  const cur=((S.wheelAngle%360)+360)%360;
  const delta=(desired-cur+360)%360;
  const dur=4200;
  const target=S.wheelAngle+360*5+delta;
  busy=true;
  svg.style.transition=`transform ${dur}ms cubic-bezier(.15,.7,.1,1)`;
  svg.getBoundingClientRect();
  requestAnimationFrame(()=>{svg.style.transform=`rotate(${target}deg)`;});
  let ticks=0; const tk=setInterval(()=>{snd.tick(); if(++ticks>26) clearInterval(tk);},140);
  setTimeout(()=>{clearInterval(tk);snd.land();},dur);
  setTimeout(()=>{busy=false;S.wheelAngle=target;revealNext=true;startBidding(pick,{});},dur+450);
}
function summaryText(){
  const rs=results();
  return 'Cabras, recuento\n'+rs.map((r,i)=>`${i+1}. ${r.p.name}: ${fmtAvg(r.avg)} de media. ${r.p.won.map(w=>`${w.name} (${w.price})`).join(', ')||'sin fichajes'}`).join('\n');
}
function share(){
  const t=summaryText();
  const copy=()=>{
    const fallback=()=>{try{const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Resumen copiado');}catch(e){toast('No se ha podido copiar');}};
    try{ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>toast('Resumen copiado'),fallback);} else fallback(); }catch(e){fallback();}
  };
  try{ if(navigator.share){navigator.share({text:t}).catch(e=>{if(!(e&&e.name==='AbortError'))copy();});return;} }catch(e){}
  copy();
}

/* ---------- events ---------- */
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-action]'); if(!b||b.disabled||busy) return;
  const a=b.dataset.action, id=+b.dataset.id;
  switch(a){
    /* navigation */
    case 'home': view='home'; confirming=null; render(); window.scrollTo(0,0); break;
    case 'rules': view='rules'; render(); window.scrollTo(0,0); break;
    case 'continue': view=null; render(); window.scrollTo(0,0); break;
    case 'new': view=null; confirming=null; set(s=>{restoreLists(s);s.phase='setup';}); window.scrollTo(0,0); break;
    case 'retry': authReady=false; render(); cloudBoot(); break;
    case 'authmode': authMode=b.dataset.m; cloudErr=''; render(); break;
    case 'showpw': {showPw=!showPw; const f=b.closest('form'); const em=f&&f.elements.email.value, pw=f&&f.elements.pass.value; render(()=>{const nf=app.querySelector('form[data-form="auth"]'); if(nf){nf.elements.email.value=em||'';nf.elements.pass.value=pw||'';}});} break;
    case 'logout': doLogout(); break;
    case 'saved': view='saved'; confirming=null; render(); window.scrollTo(0,0); loadSaved(); break;
    case 'retry-sync': if(dirty){flush();}else{setSync('saved','');} break;
    case 'open-saved': openSaved(b.dataset.id); break;
    case 'repeat-saved': repeatSaved(b.dataset.id); break;
    case 'del-saved': confirming=null; deleteSaved(b.dataset.id); break;
    /* setup */
    case 'sample': set(s=>{s.pool=SAMPLE.names.map(n=>({id:uid(),name:n}));s.players=SAMPLE.players.map(n=>({id:uid(),name:n,spent:0,won:[]}));}); break;
    case 'sample-start': view=null; set(s=>{restoreLists(s);s.pool=SAMPLE.names.map(n=>({id:uid(),name:n}));s.players=SAMPLE.players.map(n=>({id:uid(),name:n,spent:0,won:[]}));s.phase='setup';}); window.scrollTo(0,0); break;
    case 'tab': tab=b.dataset.tab; render(); break;
    case 'filter': savedFilter=b.dataset.f; render(); break;
    case 'rm-pool': set(s=>{const it=s.pool.find(p=>p.id===id);if(s.phase!=='setup')pushHist();s.pool=s.pool.filter(p=>p.id!==id);if(it&&s.phase!=='setup'){const i=s.allNames.indexOf(it.name);if(i>=0)s.allNames.splice(i,1);}}); break;
    case 'rm-player': set(s=>{s.players=s.players.filter(p=>p.id!==id);}); break;
    case 'up': case 'down': set(s=>{const i=s.players.findIndex(p=>p.id===id);const j=a==='up'?i-1:i+1;if(i<0||j<0||j>=s.players.length)return;[s.players[i],s.players[j]]=[s.players[j],s.players[i]];}); break;
    case 'sound': set(s=>{s.sound=b.dataset.on==='1';}); if(S.sound) snd.bid(); break;
    case 'start': startGame(); break;
    /* play */
    case 'roll': if(S.phase==='pick') spinWheel(); break;
    case 'bid': placeBid(+b.dataset.amt); break;
    case 'keypad': keypad=!keypad; keyBuf=''; render(); break;
    case 'key': {
        const k=b.dataset.k;
        if(k==='del') keyBuf=keyBuf.slice(0,-1); else if(keyBuf.length<5) keyBuf=(keyBuf+k).replace(/^0+(?=\d)/,'');
        const cur=S.current, p=S.players[cur.turn];
        const kp=document.getElementById('keypad'); if(kp) kp.outerHTML=keypadHTML(cur.high+1,left(p));
      } break;
    case 'bidexact': if(keyBuf) placeBid(parseInt(keyBuf,10)); break;
    case 'pass': passTurn(); break;
    case 'next': nextName(); break;
    case 'undo': undo(); break;
    case 'finish': confirming=null; set(s=>{pushHist();s.current=null;s.phase='rate';s.ratings={};s.rateIdx=0;}); window.scrollTo(0,0); break;
    /* rating + results */
    case 'score': if(S.phase==='rate'){
        const r=S.players[S.rateIdx];(S.ratings[r.id]=S.ratings[r.id]||{})[id]=+b.dataset.v;save();
        b.parentElement.querySelectorAll('button').forEach(x=>{const on=x===b;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on);});
        const d=rateDone(), nb=app.querySelector('[data-action="rate-next"]'), h=app.querySelector('.rate-hint');
        if(nb) nb.disabled=!d; if(h) h.hidden=d; snd.tick();
      } break;
    case 'rate-next': if(S.phase==='rate'&&rateDone()){set(s=>{if(s.rateIdx>=s.players.length-1){s.phase='end';celebrate=true;}else{s.rateIdx++;}});window.scrollTo(0,0);} break;
    case 'rate-prev': if(S.phase==='rate'&&S.rateIdx>0){set(s=>{s.rateIdx--;});window.scrollTo(0,0);} break;
    case 'rate-again': set(s=>{s.ratings={};s.rateIdx=0;s.phase='rate';}); window.scrollTo(0,0); break;
    case 'again': tab='mesa'; set(s=>{restoreLists(s);s.cloudId=newId();s.ownerId=user?user.id:null;s.phase='pick';}); window.scrollTo(0,0); break;
    case 'share': share(); break;
    /* confirmations */
    case 'ask': confirming=b.dataset.what; if(confirming==='edit'&&!inProgress()){doEdit();}else{render();} break;
    case 'cancel': confirming=null; render(); break;
    case 'edit': doEdit(); break;
    case 'reset': {const snd0=S.sound; confirming=null; view=null; S=fresh(); S.sound=snd0; save(); render(); window.scrollTo(0,0);} break;
  }
});
app.addEventListener('submit',e=>{
  e.preventDefault(); if(busy) return;
  const f=e.target, kind=f.dataset.form;
  if(kind==='auth'){doAuth(authMode==='signup'?'signup':'login',f.elements.email.value.trim(),f.elements.pass.value);return;}
  const inp=f.querySelector('input'), v=inp.value.trim();
  const names=v.split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean);
  if(!names.length) return;
  const focus=()=>{const nf=app.querySelector(`form[data-form="${kind}"] input`);if(nf)nf.focus();};
  if(kind==='pool') set(s=>{names.forEach(n=>s.pool.push({id:uid(),name:n}));},focus);
  else if(kind==='players') set(s=>{names.forEach(n=>s.players.push({id:uid(),name:n,spent:0,won:[]}));},focus);
  else if(kind==='addname') set(s=>{pushHist();names.forEach(n=>{s.pool.push({id:uid(),name:n});s.allNames.push(n);});},focus);
  else if(kind==='addplayer') set(s=>{pushHist();names.forEach(n=>s.players.push({id:uid(),name:n,spent:0,won:[]}));},focus);
});
app.addEventListener('change',e=>{
  if(e.target.id==='budget'){S.budget=Math.max(0,parseInt(e.target.value,10)||0);save();}
});
app.addEventListener('toggle',e=>{
  const k=e.target.dataset&&e.target.dataset.fold; if(k){S[k]=e.target.open;save();}
},true);

render();
cloudBoot();
checkUpdate();
})();
</script>
